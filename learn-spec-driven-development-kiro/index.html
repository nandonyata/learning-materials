<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>Todo List</h1>
    </header>

    <main>
      <!-- Create Todo Form -->
      <section aria-label="Create a new todo">
        <form id="create-form" novalidate>
          <div class="form-group">
            <label for="create-title">Title <span aria-hidden="true">*</span></label>
            <input
              type="text"
              id="create-title"
              name="title"
              placeholder="What needs to be done?"
              autocomplete="off"
              required
            />
          </div>
          <div class="form-group">
            <label for="create-description">Description <span class="label-optional">(optional)</span></label>
            <textarea
              id="create-description"
              name="description"
              placeholder="Add a description…"
              rows="3"
            ></textarea>
          </div>
          <button type="submit" class="btn-primary">Add Todo</button>
        </form>
      </section>

      <!-- Todo List -->
      <section aria-label="Todo items">
        <ul id="todo-list">
          <!-- todo items rendered by app.js -->
        </ul>
      </section>
    </main>
  </body>
</html>
