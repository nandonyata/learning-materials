services:
  localstack:
    container_name: localstack
    image: localstack/localstack
    ports:
    # Changed from 127.0.0.1 -> 0.0.0.0
    # Because here i'm running docker in WSL2 and the localhost is not accessible from Windows. Hence
    # I need to bind the ports to all interfaces (0.0.0.0) so that I can access the services from Windows.
      - '0.0.0.0:4566:4566' # LocalStack Gateway
      - '0.0.0.0:4510-4559:4510-4559' # external services port range
      - '0.0.0.0:443:443' # LocalStack HTTPS Gateway
    environment:
      # Activate LocalStack for AWS: https://docs.localstack.cloud/getting-started/auth-token/
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?}
      # LocalStack configuration: https://docs.localstack.cloud/references/configuration/
      - DEBUG=${DEBUG:-0}
      - PERSISTENCE=${PERSISTENCE:-0}
    volumes:
      # - '${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack'
      - '/var/run/docker.sock:/var/run/docker.sock'